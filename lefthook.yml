pre-commit:
  jobs:
    # Code: format and lint (ultracite).
    - run: pnpm fix {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      stage_fixed: true
    # Data and styles: format only. They have nothing to lint, and the lint
    # step fails when given no files, which blocked content-only commits.
    - run: pnpm exec oxfmt {staged_files}
      glob:
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
