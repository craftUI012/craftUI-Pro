<svg xmlns="http://www.w3.org/2000/svg" width="910" height="770" viewBox="0 0 91 77" fill="none">
  <title>Glass squircle pair</title>
  <defs>
    <!-- Figma "Glass" fill: left to right, #A8B8FF at 90% to 28% -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8B8FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A8B8FF" stop-opacity="0.28"/>
    </linearGradient>
    <!-- Emulates Figma background blur 12 (SVG has no backdrop-filter) -->
    <filter id="backdropBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="glassShape">
      <rect x="17" y="18" width="45" height="46" rx="12"/>
    </clipPath>
  </defs>

  <!-- Solid squircle -->
  <rect id="solid" x="30" y="11" width="45" height="46" rx="12" fill="#1F3BFF"/>

  <!-- Blurred copy of the solid, visible only through the glass -->
  <g clip-path="url(#glassShape)">
    <rect x="30" y="11" width="45" height="46" rx="12" fill="#1F3BFF" filter="url(#backdropBlur)"/>
  </g>

  <!-- Glass tint -->
  <rect id="glass" x="17" y="18" width="45" height="46" rx="12" fill="url(#glassFill)"/>

  <!-- 0.8px inside stroke, white at 50% -->
  <rect x="17.4" y="18.4" width="44.2" height="45.2" rx="11.6" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.8"/>
</svg>
